<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Test Website</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6fb;
      color: #222;
      text-align: center;
    }
    header {
      background: #4f46e5;
      color: white;
      padding: 40px 20px;
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }
    main {
      padding: 40px 20px;
    }
    .card {
      display: inline-block;
      background: white;
      border-radius: 12px;
      padding: 24px 32px;
      margin: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 260px;
    }
    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.15);
    }
    button {
      background: #4f46e5;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 24px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #3730a3;
    }
    #count {
      font-size: 1.5rem;
      font-weight: bold;
      margin-left: 12px;
    }
    footer {
      padding: 20px;
      font-size: 0.9rem;
      color: #666;
    }
  </style>
</head>
<body>

  <header>
    <h1>Welcome to My Test Website</h1>
    <p>This is a 100% static page: no database, no server.</p>
  </header>

  <main>
    <div class="card">
      <h2>Hover me</h2>
      <p>This card lifts up when your mouse moves over it.</p>
    </div>

    <div class="card">
      <h2>Click me</h2>
      <p>Press the button to count your clicks.</p>
      <button id="clickBtn">Click</button>
      <span id="count">0</span>
    </div>
  </main>

  <footer>
    Made for testing free static hosting.
  </footer>

  <script>
    let clicks = 0;
    const button = document.getElementById("clickBtn");
    const counter = document.getElementById("count");

    button.addEventListener("click", () => {
      clicks++;
      counter.textContent = clicks;
    });
  </script>

</body>
</html>
